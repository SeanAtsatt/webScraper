<!doctype html>
<html><head><title>Tables</title></head>
<body>
  <p>This page contains structured tabular data for testing the table parser.
  The first table lists users and their email addresses; the second table
  demonstrates a simple two-column layout with arbitrary data.</p>
  <table>
    <thead><tr><th>Name</th><th>Email</th></tr></thead>
    <tbody>
      <tr><td>Alice</td><td>alice@example.com</td></tr>
      <tr><td>Bob</td><td>bob@example.com</td></tr>
    </tbody>
  </table>
  <table>
    <tr><th>A</th><th>B</th></tr>
    <tr><td>1</td><td>2</td></tr>
  </table>
</body></html>
